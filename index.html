<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人网页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="stars"></canvas>
    <div class="box1">
        <nav class="doors" id="doors" aria-label="频道选择">
             <a class="door" href="#" data-modal="trunk" data-channel="trunk">
                <span class="door__shadow" aria-hidden="true"></span>
                <img class="door__art" src="./ui/door_trunk.png" alt="" draggable="false">
                 <span class="door__hover">
                    <img class="door__hover-img" src="./ui/ico_nezumi.png" alt="" draggable="false">
                 </span>
             </a>

              <a class="door" href="#" data-modal="aqua" data-channel="aqua">
                <span class="door__shadow" aria-hidden="true"></span>
                <img class="door__art" src="./ui/door_aqua.png" alt="" draggable="false">
                 <span class="door__hover">
                    <img class="door__hover-img" src="./ui/ico_sakana.png" alt="" draggable="false">
                 </span>
              </a>

              <a class="door" href="#" data-modal="cons" data-channel="cons">
                <span class="door__shadow" aria-hidden="true"></span>
                <img class="door__art" src="./ui/door_cons.png" alt="" draggable="false">
                 <span class="door__hover">
                    <img class="door__hover-img" src="./ui/ico_acrsai.png" alt="" draggable="false">
                 </span>
              </a>

              <button id="ID" class="door" type="button" data-channel="your">
                <span class="door__shadow" aria-hidden="true"></span>
                <img class="door__art" src="./ui/door_your.png" alt="" draggable="false">
                 <span class="door__hover">
                    <img class="door__hover-img" src="./ui/hover_your.png" alt="" draggable="false">
                 </span>
              </button>

 
       <!-- <! 悬停文字  -->
        <span class="door__caption" data-caption="trunk">日常日记</span>
        <span class="door__caption" data-caption="aqua">项目展示</span>
        <span class="door__caption" data-caption="cons">联系方式</span>
        <span class="door__caption" data-caption="your">个人简介</span>

    </nav>
    <span id="声明">页面素材来自游戏“For the GHOSTs“</span>
    </div>
    <div class="box2">
      <div class="b2-layer b2-back"></div>
      <!-- 标题直接放在 box2 下，到 box2 顶部的距离固定 -->
      <div id="title">个人简介</div>
      <div class="b2-layer b2-front">
         <div class="content">
            <div style="height:172px;"></div><!-- 占位：保持下方头像卡片位置不变 -->
            <div  class="name" style="border-radius:50px; width: 1000px;height: 1000px;background-color: #fafbfc;">
                <span style="width:100px;height: 100px;">
                    <img class="name" id="avatar" src="./ui/sakana1.jpg" style="border-radius: 30px; top: 100px; left: 20px; width: 250px;height: 250px;"><br>
                    <p class="n" style="">2Cu</p>
                    <p class="n" style="color: black;top: 450px;left: 0px;width: 1000px;height: 50px;font-size: 50%;font-style: oblique;">Trying to be better</p>
                </span>

            </div>
         </div>
      </div>
   </div>
    
    <div class="modal" id="modal" aria-hidden="true">
        <div class="modal__backdrop" id="modalBackdrop" data-close></div>
        <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal__close" id="modalClose" type="button" aria-label="关闭">×</button>

            <div class="modal__head">
                <img class="modal__resident" id="modalResident" alt="" hidden>
                <div class="modal__titles">
                    <h2 class="modal__title" id="modalTitle"></h2>
                    <p class="modal__jp" id="modalJp"></p>
                </div>
            </div>

            <div class="modal__body" id="modalBody"></div>
            <p class="modal__enter" id="modalEnter"></p>
        </div>
    </div>

    <!-- 点击头像放大 -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
        <div class="lightbox__backdrop" id="lightboxBackdrop"></div>
        <img class="lightbox__img" id="lightboxImg" alt="">
    </div>

    <script src="app.js"></script>
</body>
</html>
